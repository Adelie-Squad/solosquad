  - id: omnihuman-2.0
    name: OmniHuman 2.0
    vendor: ByteDance
    category: character
    release: 2026-10
    status: ga
    access: [app, api]
    primitives: [avatar.audio_driven]
    limits:
      audio_s: {min: 4, max: 300}
      resolutions: [720p]
    strengths:
      - 一张图加一段音频，就能生成单镜长表演
      - 动作随语义和节奏变化；支持多人、非人角色和唱歌
      - 可以用提示词控制姿态、镜头和互动
    weaknesses:
      - 表演好坏主要取决于音频的表现力
    cost: {usd_per_s: 0.07, note: "BytePlus 0.07 美元/秒（原 0.12），fal 0.105"}
    license: {commercial: true, note: BytePlus 条款}
    sources:
