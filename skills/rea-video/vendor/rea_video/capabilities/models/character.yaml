# 人物驱动：动作迁移 / 数字人 / 口型重配 / 虚拟试穿

models:
  - id: kling-motion-control
    name: Kling Motion Control（2.6 / 3.0）
    vendor: Kuaishou
    category: character
    release: 2025-12
    status: ga
    access: [app, api, api-aggregator]
    primitives: [motion.transfer]
    strengths:
      - 把参考视频里的动作迁移到角色图上；第三方视其为动作控制的质量标杆
      - 有技术报告（arXiv 2603.03160）
      - 3.0 版可以绑定主体，保持脸部一致（只用脸，不管衣服发型；只在跟随视频朝向模式下可用）
    weaknesses:
      - 用他人视频驱动时要注意肖像权与版权
    license: {commercial: true, note: 以平台条款为准}
    sources:
      - https://arxiv.org/html/2603.03160v1
      - https://templix.app/blogs/best-ai-motion-control-and-animation-models-in-2026
      - https://kling.ai/quickstart/motion-control-user-guide
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium
    notes: 3.0 版 2026-03-04 上 API；参考视频 3–30 秒、一镜到底、全身和头部可见；动作太快时输出可能比参考短

