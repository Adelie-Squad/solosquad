    verified: {date: 2026-11-12, basis: vendor}
    confidence: medium
    notes: BytePlus 2026-10-15 上线；图片边长 300–6000 px、宽高比 0.4–2.5；人、动物、动漫、3D 角色都能驱动；即梦数字人是否已经用 2.0 没有确认

