# 图像模型（关键帧 / 首帧 / 分镜 / 画内文字）

models:
  - id: gpt-image-2.5
    name: GPT Image 2.5
    vendor: OpenAI
    category: image
    release: 2026-09
    status: ga
    access: [api, app, api-aggregator]
    primitives: [image.t2i, image.edit_multi_ref, image.text_render]
    strengths:
      - "【用户实测】中文字体效果最好、真实感最高，是中文画内文字和写实首帧的首选"
      - 指令遵循稳定；可输出透明背景（PNG/WebP）；质量档位可到 xhigh 和 max
    weaknesses:
      - 价格与速度取决于质量档位
    license: {commercial: true}
    sources:
      - https://www.eachlabs.ai/blog/best-ai-image-generation-models-2026
      - https://developers.openai.com/api/docs/models
    verified: {date: 2026-10-29, basis: user}
    confidence: high
    notes: 分 sunburst（质量）和 flare（快速）两个版本，已被 gpt-image-2.6 取代；发布日期 9 月或 10 月，来源不一；Hypit 目前接入的是 GPT Image 2（通过 HypiHub，2K/4K 部分画幅不可用）

  - id: gpt-image-2.6
    name: GPT Image 2.6（Sunburst / Flare）
    vendor: OpenAI
    category: image
    release: 2026-11
    status: ga
    access: [api, app, api-aggregator]
    primitives: [image.t2i, image.edit_multi_ref, image.text_render]
    strengths:
      - Artificial Analysis 文生图榜第一（Sunburst 最高质量档）
      - 可以在图上圈出要改的地方（markup 编辑）；能出透明背景、SVG 和动图
    weaknesses:
      - 最高质量档一张最长约 2 分钟、价格高；连续多次编辑会漂
      - 文字的精确位置仍可能不准；中文文字效果官方没有说明
    license: {commercial: true}
    sources:
      - https://developers.openai.com/api/docs/guides/image-generation
      - https://developers.openai.com/api/docs/guides/image-prompting
      - https://kingy.ai/ai-launch-tracker/chatgpt-images-2-6-2026-11-04/
    verified: {date: 2026-11-12, basis: vendor}
    confidence: medium
    notes: 2026-11-04 发布；模型 ID gpt-image-2.6-sunburst（质量）/ gpt-image-2.6-flare（快速）；边长 3840 以内且是 16 的倍数，长宽比 1:3–3:1

