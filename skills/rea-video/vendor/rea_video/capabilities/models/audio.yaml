    license: {commercial: true, note: Apache 2.0}
    sources:
      - https://peihuachen.github.io/ai-tools-hub/posts/tts-commercial-open-source-comparison-guide-2026.html
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium
    notes: 发布月份为估计值；克隆所需音频时长资料说法不一（3 秒或 10–20 秒）

