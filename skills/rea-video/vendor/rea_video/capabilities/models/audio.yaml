# 音频：配音 / 克隆 / 音乐 / 音效 / 视频生音效

models:
  - id: minimax-speech-2.8
    name: MiniMax Speech 2.8（Turbo / HD）
    vendor: MiniMax
    category: audio
    release: 2026-06
    status: ga
    access: [api, api-aggregator]
    primitives: [audio.tts, audio.voice_clone]
    strengths:
      - "【用户确认】支持音色克隆"
      - 中文第一梯队，中文是原生优势；支持粤语
    cost: {note: "Turbo 每百万字符 30–60 美元，HD 每百万字符 50–80 美元（2026-07 第三方数据）"}
    license: {commercial: true}
    sources:
      - https://peihuachen.github.io/ai-tools-hub/posts/tts-commercial-open-source-comparison-guide-2026.html
    verified: {date: 2026-10-29, basis: user}
    confidence: high
    notes: 发布月份为估计值

  - id: indextts-2
    name: IndexTTS2 / IndexTTS 2.5（开源，B 站）
    vendor: Bilibili
    category: audio
    release: 2025-09
    status: ga
    access: [open-weights]
    primitives: [audio.tts, audio.voice_clone, audio.tts_duration_control]
    strengths:
      - 自回归 TTS 中少见的显式时长控制，适合把新配音塞进原片时间窗
      - 情感与音色解耦；零样本克隆；中英双语
    weaknesses:
      - 需要自己部署
    license: {commercial: conditional, note: 以仓库许可为准}
    sources:
      - https://arxiv.org/html/2506.21619v2
      - https://arxiv.org/html/2601.03888v3
    verified: {date: 2026-10-29, basis: vendor}
    confidence: high

  - id: qwen3-tts
