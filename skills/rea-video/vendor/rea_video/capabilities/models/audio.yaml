  - id: hunyuanvideo-foley
    name: HunyuanVideo-Foley
    vendor: Tencent
    category: audio
    release: 2025-08
    status: ga
    access: [open-weights, api-aggregator]
    primitives: [audio.v2a_foley]
    strengths:
      - 看视频生成同步音效，48kHz；同步指标最好（DeSync 0.74，MMAudio 为 0.80）
    weaknesses:
      - 需要 8–20GB 显存
      - 许可排除欧盟、英国、韩国（第三方称输出同样受限）
    license: {commercial: conditional, note: 腾讯社区许可}
    regions_excluded: [EU, UK, KR]
    sources:
      - https://github.com/Tencent-Hunyuan/HunyuanVideo-Foley
      - https://www.creativeainews.com/articles/how-to-add-sound-effects-to-ai-video-2026/
    verified: {date: 2026-10-29, basis: third-party}
    confidence: high

