    vendor: Alibaba
    category: audio
    release: 2026-01
    status: ga
    access: [open-weights, api]
    primitives: [audio.tts, audio.voice_clone]
    strengths:
      - 3 秒音频即可克隆；支持粤语、四川话、北京话、上海话
