# 代码渲染 / 合成 / 后期

models:
  - id: remotion
    name: Remotion
    vendor: Remotion（开源，商用需许可）
    category: render
    status: ga
    access: [open-weights]
    primitives: [render.code_graphics, render.compose]
    strengths:
      - 用 React 写视频：文字、UI、图表、MG 都能 100% 准确并参数化
      - 官方提供 Agent Skills，可直接配合 Claude Code、Codex 使用
      - 渲染结果确定，可以逐帧和原片做像素级差分
    weaknesses:
      - 照片级画面需要和生成层叠加
    license: {commercial: conditional, note: "个人和小团队免费，公司需购买 Remotion 许可"}
    sources:
      - https://www.tella.com/blog/how-to-use-remotion-agent-skills-with-claude-code
      - https://www.remotion.dev/
    verified: {date: 2026-10-29, basis: knowledge}
    confidence: high

