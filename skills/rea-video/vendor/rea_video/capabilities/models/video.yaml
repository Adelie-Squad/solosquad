# 视频生成 / 编辑模型
# 字段说明见 ../README.md；规格大多来自厂商公告或第三方汇总，status/verified/confidence 标明可信度。
# 价格单位 usd_per_s 为第三方列价折算，仅作路由时的相对成本参考。

models:
  - id: seedance-2.5
    name: Seedance 2.5
    vendor: ByteDance Seed
    category: video
    release: 2026-07
    status: ga
    access: [app, api-aggregator]
    primitives: [video.t2v, video.i2v_first_frame, video.i2v_first_last, video.multi_reference, video.reference_video, video.reference_audio, video.multi_shot, video.extend, video.edit_v2v, video.camera_control, video.native_audio]
    limits:
      duration_s: {max: 30}
      resolutions: [480p, 720p, 1080p]
      refs: {image: 30, video: 10, audio: 10}
      # 首帧 / 首尾帧 和 参考图 / 参考视频 / 参考音频 不能放在同一个请求里（多家接口文档一致；即梦 App 的「全能参考」可用 @图片 作为首帧）
      exclusive_inputs: [[video.i2v_first_frame, video.i2v_first_last], [video.multi_reference, video.reference_video, video.reference_audio]]
    audio: {native: true}
    strengths:
      - 单次 30 秒，内含多个逻辑连贯的镜头
      - 一次可传 30 图 + 10 视频 + 10 音频参考；支持 clay render（无纹理 3D 白模）、动作、创意参考
      - 时间戳级局部编辑、绿幕换背景、改机位、续写延长（可到数分钟）
      - 国内电商复刻产品（OiiOii、Hypit）的主力模型
    weaknesses:
      - 官方承认复杂动作的物理合理性、多主体互动的稳定性仍有不足
      - 官方未公布最大分辨率；Hypit 的 HypiHub 通道提供 480p/720p/1080p
    cost:
      note: 实测参考：OiiOii 复刻 50 秒电商视频约 40 元（480p 生成后超分到 1080p）
    license: {commercial: true, note: 以平台条款为准}
    sources:
      - https://seed.bytedance.com/en/blog/one-take-creation-flexible-referencing-introducing-seedance-2-5
      - https://github.com/hypit-ai/hypit/blob/main/packages/provider-hypihub/README.md
      - https://docs.byteplus.com/docs/en/modelark/seedance-2-5.md
      - https://apiframe.ai/docs/videos/seedance/seedance-2-5
    verified: {date: 2026-11-11, basis: vendor}
    confidence: high

