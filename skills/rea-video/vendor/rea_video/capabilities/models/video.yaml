  - id: kling-4.0
    name: Kling 4.0（可灵 4.0）
    vendor: Kuaishou
    category: video
    release: 2026-10
    status: ga
    access: [app, api, api-aggregator]
    primitives: [video.t2v, video.i2v_first_frame, video.i2v_first_last, video.keyframes, video.multi_reference, video.reference_video, video.multi_shot, video.edit_v2v, video.camera_control, video.native_audio]
    limits:
      duration_s: {min: 3, max: 30}
      resolutions: [720p, 1080p, 4K]
      refs: {image: 10, video: 5, audio: 1, total: 15}
      prompt_tokens: 8000
      keyframes: 10
    audio: {native: true, voice_ref: true}
    strengths:
      - 首尾帧 + 最多 10 张关键帧，复杂运镜和中间状态可控
      - Omni Reference 最多 15 个参考（10 图、5 段视频合计 30 秒、7 个 element）
      - 视频编辑：表情、肢体、机位、风格、背景、角色均可改（最多 5 段输入、合计 30 秒）
      - 立体声，多语种对白与口音；屏幕文字支持多语种和 emoji
      - 画幅 21:9 / 16:9 / 1:1 / 9:16
      - 默认自动分镜，镜头按时间直接写在提示词里
    weaknesses:
      - 10-bit HDR 与续写（最长 2 分钟）还没上线
      - 音频参考只能当声音参考
    cost: {usd_per_s: 0.235, note: "fal 列价 720p 0.157、1080p 0.235 美元/秒；官方 API 价未公布"}
    license: {commercial: true, note: 以平台条款为准}
    sources:
      - https://fal.ai/learn/tools/what-is-kling-4-0
      - https://kling.ai/quickstart/kling-4-model-user-guide
      - https://kling.ai/document-api/updates/api.md
    verified: {date: 2026-11-12, basis: vendor}
    confidence: medium
    notes: App 2026-10-15 正式上线，官方 API 2026-10-28 全面开放；续写（最长 2 分钟）和 10-bit HDR 仍是 coming soon；Flash 版单独成条（kling-4.0-flash）

