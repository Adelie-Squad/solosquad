# Demo scenario (decision 62 · PRD §3.5.2 ④) — 재무 관리: 매달 손익 정리.
# `__FILES__` becomes the copy's sample files folder when a demo account is issued.
name: finance-monthly
title: 재무 관리
description: 은행 거래 내역 · 마켓 정산 → 월 손익표(팀 승인) → 거래처 대금 지급(대표 승인). 데모 — 실제 송금은 없어요.
enabled: true
team: business
steps:
  - id: read
    agent: finance
    prompt: "#demo:finance.read 10월 은행 거래 내역과 마켓 정산 파일을 읽어줘."
  - id: classify
    agent: finance
    prompt: "#demo:finance.classify 거래를 항목별로 나눠줘."
  - id: pnl
    tool: demo.pnl
    with: {bank: "__FILES__/bank-2026-10.csv", market: "__FILES__/market-settlement-2026-10.csv"}
    save_as: {kind: finance.pnl, title: 10월 손익표}
  - id: compare
    agent: data-analyst
    prompt: "#demo:finance.compare 지난달과 비교하고 평소와 다른 거래를 표시해줘."
  - id: review
    approval:
      title: 10월 손익표 확인
      summary: "{{ steps.pnl.summary }}"
      risk: low
      category: review
  - id: payables
    tool: demo.payables
    with: {file: "__FILES__/payables-2026-11.csv"}
    save_as: {kind: finance.payables, title: 11월 1주 거래처 대금 지급안}
  - id: pay
    approval:
      title: "거래처 대금 지급 {{ steps.payables.total_text }}"
      summary: "{{ steps.payables.summary }} · 데모 — 실제로 보내지 않아요"
      risk: high
      category: payment
      on_decline: hold
  - id: paid
    agent: finance
    prompt: "#demo:finance.paid 지급을 처리하고 결과를 알려줘."
    save_as: {kind: brief, title: 지급 처리 결과}
    end: true
  - id: hold
    agent: finance
    prompt: "#demo:finance.hold 지급을 멈추고 다시 정리해줘."
    save_as: {kind: brief, title: 지급 보류 메모}
