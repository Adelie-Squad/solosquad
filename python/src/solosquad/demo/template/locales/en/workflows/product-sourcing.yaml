# Demo scenario (decision 62 · PRD §3.5.2 ④) — Product sourcing, for an English account.
# The Korean file (../../../workflows/) is the source: same steps, this file's words.
name: product-sourcing
title: Product sourcing
description: Quotes from 3 suppliers → a landed cost comparison (team approval) → a purchase order draft in Chinese → confirming the order (owner approval). Demo — nothing is actually ordered.
enabled: true
team: business
steps:
  - id: quotes
    agent: researcher
    prompt: "#demo:sourcing.quotes Collect the insulated tumbler suppliers' quotes and minimum order quantities."
  - id: compare
    tool: demo.supplier_compare
    with: {file: "__FILES__/supplier-quotes.csv", lang: en}
    save_as: {kind: sourcing.comparison, title: Insulated tumbler landed cost comparison}
  - id: analyze
    agent: data-analyst
    prompt: "#demo:sourcing.analyze Add shipping and duty to the unit price and compare the landed cost."
  - id: margin
    agent: finance
    prompt: "#demo:sourcing.margin Work out the expected margin per supplier."
  - id: shortlist
    approval:
      title: Review the supplier comparison
      summary: "{{ steps.compare.summary }}"
      risk: low
      category: review
  - id: draft
    agent: sales
    prompt: "#demo:sourcing.draft Draft the purchase order in the recommended supplier's language (Chinese)."
  - id: po
    tool: demo.purchase_order
    with: {file: "__FILES__/po-lines.csv", supplier: "{{ steps.compare.recommended }}", lang: en}
    save_as: {kind: sourcing.po, title: Purchase order draft (Chinese)}
  - id: order
    approval:
      title: "Confirm the order {{ steps.po.total_text }}"
      summary: "{{ steps.po.summary }} · Demo — nothing is actually sent"
      risk: high
      category: purchase
      on_decline: renegotiate
  - id: sent
    agent: sales
    prompt: "#demo:sourcing.sent Confirm the order and tell me the delivery schedule."
    save_as: {kind: brief, title: Order result}
    end: true
  - id: renegotiate
    agent: sales
    prompt: "#demo:sourcing.renegotiate Stop the order and rework the terms."
    save_as: {kind: brief, title: Renegotiation note}
