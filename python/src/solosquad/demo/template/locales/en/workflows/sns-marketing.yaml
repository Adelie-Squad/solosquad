# Demo scenario (decision 62 · PRD §3.5.2 ④) — Social media marketing, for an English account.
# The Korean file (../../../workflows/) is the source: same steps, this file's words.
name: sns-marketing
title: Social media marketing
description: Last week's reactions → a week of content → English · Chinese post drafts (team approval) → paying for ads (owner approval). Demo — nothing is actually posted or advertised.
enabled: true
team: brand
steps:
  - id: reactions
    agent: data-analyst
    prompt: "#demo:sns.reactions Sum up the reactions to last week's posts."
  - id: calendar
    tool: demo.sns_calendar
    with: {week: "__FILES__/sns-week.csv", last_week: "__FILES__/sns-last-week.csv", lang: en}
    save_as: {kind: sns.calendar, title: This week's content calendar}
  - id: plan
    agent: marketer
    prompt: "#demo:sns.plan Plan a week of content from last week's reactions."
  - id: write
    agent: creative
    prompt: "#demo:sns.drafts Write the captions and image drafts in English · Chinese."
  - id: posts
    tool: demo.sns_posts
    with: {file: "__FILES__/sns-posts.csv", lang: en}
    save_as: {kind: sns.posts, title: Post drafts (English · Chinese)}
  - id: publish_ok
    approval:
      title: Publish the posts
      summary: "{{ steps.posts.summary }} — check the captions and the image notes · Demo — nothing is actually posted"
      risk: low
      category: publish
  - id: ads
    tool: demo.ad_plan
    with: {budget: 300000, lang: en}
    save_as: {kind: sns.ads, title: Instagram ad plan}
  - id: ad_spend
    approval:
      title: "Pay for the ads {{ steps.ads.budget_text }}"
      summary: "{{ steps.ads.summary }} · Demo — nothing is actually paid"
      risk: high
      category: payment
      on_decline: organic
  - id: launched
    agent: marketer
    prompt: "#demo:sns.launched Schedule the approved posts and ads."
    save_as: {kind: brief, title: Posts · ads scheduled}
    end: true
  - id: organic
    agent: marketer
    prompt: "#demo:sns.organic Rework the posts without ads."
    save_as: {kind: brief, title: Posting without ads}
