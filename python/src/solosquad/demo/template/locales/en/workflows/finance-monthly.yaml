# Demo scenario (decision 62 · PRD §3.5.2 ④) — Monthly finance, for an English account.
# The Korean file (../../../workflows/) is the source: same steps, this file's words.
name: finance-monthly
title: Monthly finance
description: Bank transactions · market settlements → the monthly P&L (team approval) → paying the vendors (owner approval). Demo — no money is actually sent.
enabled: true
team: business
steps:
  - id: read
    agent: finance
    prompt: "#demo:finance.read Read the October bank transactions and the market settlement files."
  - id: classify
    agent: finance
    prompt: "#demo:finance.classify Sort the transactions by account."
  - id: pnl
    tool: demo.pnl
    with: {bank: "__FILES__/bank-2026-10.csv", market: "__FILES__/market-settlement-2026-10.csv", lang: en}
    save_as: {kind: finance.pnl, title: October P&L}
  - id: compare
    agent: data-analyst
    prompt: "#demo:finance.compare Compare with last month and mark the unusual transactions."
  - id: review
    approval:
      title: Review the October P&L
      summary: "{{ steps.pnl.summary }}"
      risk: low
      category: review
  - id: payables
    tool: demo.payables
    with: {file: "__FILES__/payables-2026-11.csv", lang: en}
    save_as: {kind: finance.payables, title: Vendor payment plan for the first week of November}
  - id: pay
    approval:
      title: "Pay the vendors {{ steps.payables.total_text }}"
      summary: "{{ steps.payables.summary }} · Demo — nothing is actually sent"
      risk: high
      category: payment
      on_decline: hold
  - id: paid
    agent: finance
    prompt: "#demo:finance.paid Process the payment and tell me the result."
    save_as: {kind: brief, title: Payment result}
    end: true
  - id: hold
    agent: finance
    prompt: "#demo:finance.hold Stop the payment and rework it."
    save_as: {kind: brief, title: Payment on hold}
