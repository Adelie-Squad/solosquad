# Demo scenario (decision 62 · PRD §3.5.2 ④) — 社媒营销，给中文账户。
# 韩语文件（../../../workflows/）是来源：步骤相同，文字用这里的。
name: sns-marketing
title: 社媒营销
description: 上周反馈 → 一周内容排期 → Instagram · 小红书帖子草稿（团队审批）→ 支付广告费（代表审批）。演示 — 不会实际发布或投放广告。
enabled: true
team: brand
steps:
  - id: reactions
    agent: data-analyst
    prompt: "#demo:sns.reactions 整理上周帖子的反馈。"
  - id: calendar
    tool: demo.sns_calendar
    with: {week: "__FILES__/sns-week.csv", last_week: "__FILES__/sns-last-week.csv", lang: zh-CN}
    save_as: {kind: sns.calendar, title: 本周内容排期}
  - id: plan
    agent: marketer
    prompt: "#demo:sns.plan 根据上周反馈安排一周内容。"
  - id: write
    agent: creative
    prompt: "#demo:sns.drafts 用中文写 Instagram · 小红书的文案和图片草稿。"
  - id: posts
    tool: demo.sns_posts
    with: {file: "__FILES__/sns-posts.csv", lang: zh-CN}
    save_as: {kind: sns.posts, title: 帖子草稿（Instagram · 小红书）}
  - id: publish_ok
    approval:
      title: 发布帖子
      summary: "{{ steps.posts.summary }} — 请确认文案和图片备注 · 演示 — 不会实际发布"
      risk: low
      category: publish
  - id: ads
    tool: demo.ad_plan
    with: {budget: 300000, lang: zh-CN}
    save_as: {kind: sns.ads, title: Instagram 广告投放方案}
  - id: ad_spend
    approval:
      title: "支付广告费 {{ steps.ads.budget_text }}"
      summary: "{{ steps.ads.summary }} · 演示 — 不会实际付款"
      risk: high
      category: payment
      on_decline: organic
  - id: launched
    agent: marketer
    prompt: "#demo:sns.launched 排期获批的帖子和广告。"
    save_as: {kind: brief, title: 帖子 · 广告排期结果}
    end: true
  - id: organic
    agent: marketer
    prompt: "#demo:sns.organic 不投广告，只重新整理帖子。"
    save_as: {kind: brief, title: 不投广告发布}
