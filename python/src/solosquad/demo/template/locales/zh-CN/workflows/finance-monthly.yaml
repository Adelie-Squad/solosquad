# Demo scenario (decision 62 · PRD §3.5.2 ④) — 财务管理，给中文账户。
# 韩语文件（../../../workflows/）是来源：步骤相同，文字用这里的。
name: finance-monthly
title: 财务管理
description: 银行流水 · 平台结算 → 月度损益表（团队审批）→ 支付供应商货款（代表审批）。演示 — 不会实际汇款。
enabled: true
team: business
steps:
  - id: read
    agent: finance
    prompt: "#demo:finance.read 读取10月的银行流水和平台结算文件。"
  - id: classify
    agent: finance
    prompt: "#demo:finance.classify 按科目整理交易。"
  - id: pnl
    tool: demo.pnl
    with: {bank: "__FILES__/bank-2026-10.csv", market: "__FILES__/market-settlement-2026-10.csv", lang: zh-CN}
    save_as: {kind: finance.pnl, title: 10月损益表}
  - id: compare
    agent: data-analyst
    prompt: "#demo:finance.compare 与上月比较，并标出异常交易。"
  - id: review
    approval:
      title: 确认10月损益表
      summary: "{{ steps.pnl.summary }}"
      risk: low
      category: review
  - id: payables
    tool: demo.payables
    with: {file: "__FILES__/payables-2026-11.csv", lang: zh-CN}
    save_as: {kind: finance.payables, title: 11月第1周供应商付款方案}
  - id: pay
    approval:
      title: "支付供应商货款 {{ steps.payables.total_text }}"
      summary: "{{ steps.payables.summary }} · 演示 — 不会实际汇出"
      risk: high
      category: payment
      on_decline: hold
  - id: paid
    agent: finance
    prompt: "#demo:finance.paid 处理付款并告诉我结果。"
    save_as: {kind: brief, title: 付款处理结果}
    end: true
  - id: hold
    agent: finance
    prompt: "#demo:finance.hold 暂停付款并重新整理。"
    save_as: {kind: brief, title: 付款暂停备忘}
