# Demo scenario (decision 62 · PRD §3.5.2 ④) — 商品采购，给中文账户。
# 韩语文件（../../../workflows/）是来源：步骤相同，文字用这里的。
name: product-sourcing
title: 商品采购
description: 3家供应商报价 → 成本对比表（团队审批）→ 中文采购订单草稿 → 确认下单（代表审批）。演示 — 不会实际下单。
enabled: true
team: business
steps:
  - id: quotes
    agent: researcher
    prompt: "#demo:sourcing.quotes 收集保温杯供应商的报价和最小起订量。"
  - id: compare
    tool: demo.supplier_compare
    with: {file: "__FILES__/supplier-quotes.csv", lang: zh-CN}
    save_as: {kind: sourcing.comparison, title: 保温杯成本对比表}
  - id: analyze
    agent: data-analyst
    prompt: "#demo:sourcing.analyze 在单价上加上运费和关税，比较到岸成本。"
  - id: margin
    agent: finance
    prompt: "#demo:sourcing.margin 计算各供应商的预计毛利。"
  - id: shortlist
    approval:
      title: 确认供应商对比表
      summary: "{{ steps.compare.summary }}"
      risk: low
      category: review
  - id: draft
    agent: sales
    prompt: "#demo:sourcing.draft 用推荐供应商的语言（中文）起草采购订单。"
  - id: po
    tool: demo.purchase_order
    with: {file: "__FILES__/po-lines.csv", supplier: "{{ steps.compare.recommended }}", lang: zh-CN}
    save_as: {kind: sourcing.po, title: 采购订单草稿（中文）}
  - id: order
    approval:
      title: "确认下单 {{ steps.po.total_text }}"
      summary: "{{ steps.po.summary }} · 演示 — 不会实际发送"
      risk: high
      category: purchase
      on_decline: renegotiate
  - id: sent
    agent: sales
    prompt: "#demo:sourcing.sent 确认下单并告诉我到货日程。"
    save_as: {kind: brief, title: 下单处理结果}
    end: true
  - id: renegotiate
    agent: sales
    prompt: "#demo:sourcing.renegotiate 暂停下单并重新整理条件。"
    save_as: {kind: brief, title: 重新议价备忘}
